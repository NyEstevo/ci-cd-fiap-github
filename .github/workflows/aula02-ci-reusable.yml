# ============================================
# WORKFLOW: CI com Workflows Reutilizáveis
# Demonstra como chamar workflows reutilizáveis
# ============================================
name: 🚀 Aula 02 - CI with Reusable Workflows

on:
  push:
    branches: [ main ]
    paths:
      - 'fiap-dclt-aula02/**'
      - '.github/workflows/aula02-ci-reusable.yml'
  workflow_dispatch:

jobs:
  # ============================================
  # Chamar workflow reutilizável com Node 18
  # ============================================
  test-node-18:
    name: 🧪 Test Node 18
    uses: ./.github/workflows/aula02-reusable-test.yml
    with:
      node-version: '18'
      working-directory: fiap-dclt-aula02/app
  
  # ============================================
  # Chamar workflow reutilizável com Node 20
  # ============================================
  test-node-20:
    name: 🧪 Test Node 20
    uses: ./.github/workflows/aula02-reusable-test.yml
    with:
      node-version: '20'
      working-directory: fiap-dclt-aula02/app
  
  # ============================================
  # Deploy só após todos os testes passarem
  # ============================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test-node-18, test-node-20]
    
    steps:
      - name: 🚀 Deploy
        run: echo "✅ Todos os testes passaram! Deploying..."